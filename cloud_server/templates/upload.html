<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload Files</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upload-container {
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .upload-card {
            background: rgba(33, 37, 41, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .upload-icon {
            font-size: 3rem;
            color: #a855f7;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 2rem 1rem;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        .success-message {
            display: none;
            color: #22c55e;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="upload-container">
        <div class="upload-card">
            <div class="upload-icon">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="h4 mb-3">Upload Documents</h2>
            <p class="text-muted small mb-4">Select PDF or Image files to print</p>

            <form method="post" enctype="multipart/form-data" id="uploadForm">
                <div class="file-input-wrapper">
                    <i class="fa-regular fa-folder-open fa-2x mb-3 text-secondary"></i>
                    <p class="mb-0 text-muted">Tap to select files</p>
                    <input type="file" name="files" accept=".pdf,.jpg,.jpeg,.png" multiple required id="fileInput"
                        onchange="updateFileName()">
                </div>

                <div id="fileList" class="mb-3 text-start small text-muted"></div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary upload-btn" id="uploadBtn">
                        Upload Files
                    </button>
                    <button class="btn btn-secondary mt-3 d-none" type="button" onclick="location.reload()"
                        id="reloadBtn">Add More</button>
                </div>
            </form>

            <div class="success-message" id="successMsg">
                <i class="fa-solid fa-check-circle me-2"></i>Uploaded Successfully!
                <p class="small text-muted mt-1">Files sent to Kiosk.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateFileName() {
            const input = document.getElementById('fileInput');
            const list = document.getElementById('fileList');
            const files = input.files;

            if (files.length > 0) {
                let html = '<ul class="list-unstyled">';
                for (let i = 0; i < files.length; i++) {
                    html += `<li><i class="fa-solid fa-paperclip me-2 text-primary"></i>${files[i].name}</li>`;
                }
                html += '</ul>';
                list.innerHTML = html;
            } else {
                list.innerHTML = '';
            }
        }

        document.getElementById("uploadForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const btn = document.getElementById("uploadBtn");
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;

            const formData = new FormData(this);

            fetch(window.location.href, {
                method: "POST",
                body: formData
            })
                .then(async response => {
                    if (response.ok) {
                        document.getElementById("uploadForm").style.display = "none";
                        document.getElementById("successMsg").style.display = "block";
                        document.querySelector(".upload-card").style.borderColor = "#22c55e";
                        document.querySelector(".upload-icon").style.color = "#22c55e";
                        document.querySelector(".upload-icon").innerHTML = '<i class="fa-solid fa-check"></i>';
                        document.querySelector(".upload-icon").style.animation = "none";
                        document.getElementById("reloadBtn").classList.remove("d-none");
                        document.getElementById("reloadBtn").style.display = "block";
                    } else {
                        const errorText = await response.text();
                        alert("Upload failed: " + errorText);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Network Error: " + err.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });
    </script>
</body>

</html>
